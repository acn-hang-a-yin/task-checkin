<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的打卡小天地</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/child.css">
</head>
<body class="child-body">
    <!-- 顶部固定栏：星星数 + 实时时钟 + 头像昵称 -->
    <header class="app-header child-header">
        <div class="container header-inner">
            <div class="brand">
                <span class="brand-emoji">⭐</span>
                <span class="star-chip">我的星星：<b id="star-count">0</b></span>
            </div>
            <div class="header-right">
                <span id="system-clock" class="system-clock"></span>
                <span class="user-chip" id="header-user">加载中…</span>
                <button id="logout-btn" class="btn btn-ghost">退出</button>
            </div>
        </div>
    </header>

    <!-- 页签 -->
    <nav class="tab-bar child-tab-bar">
        <div class="container tab-inner">
            <button class="tab-btn active" data-tab="today">✅ 今日</button>
            <button class="tab-btn" data-tab="records">📅 记录</button>
            <button class="tab-btn" data-tab="rewards">🎁 奖励</button>
            <button class="tab-btn" data-tab="messages">💬 消息<span id="message-dot" class="tab-dot" hidden></span></button>
        </div>
    </nav>

    <main class="container app-main child-main">
        <!-- 页签一：今日 -->
        <section class="tab-panel active" id="panel-today">
            <div class="panel-head">
                <h2>今天要做的</h2>
                <span id="today-progress" class="progress-text"></span>
            </div>
            <div id="today-list" class="today-list">
                <p class="loading-text">加载中…</p>
            </div>
        </section>

        <!-- 页签二：记录 -->
        <section class="tab-panel" id="panel-records">
            <div class="panel-head">
                <h2>我的打卡记录</h2>
                <span id="streak-text" class="streak-text"></span>
            </div>
            <div id="child-calendar" class="calendar-wrap"></div>
            <div id="child-day-detail" class="day-detail"></div>
        </section>

        <!-- 页签三：奖励 -->
        <section class="tab-panel" id="panel-rewards">
            <div class="panel-head">
                <h2>我的星星和奖励</h2>
            </div>
            <div id="badge-wall" class="badge-wall"></div>
            <div id="shop-list" class="shop-list">
                <p class="loading-text">加载中…</p>
            </div>
            <div id="my-redemptions" class="my-redemptions"></div>
        </section>

        <!-- 页签四：消息 -->
        <section class="tab-panel" id="panel-messages">
            <div class="panel-head">
                <h2>家长留言</h2>
            </div>
            <div id="message-list" class="message-list">
                <p class="loading-text">加载中…</p>
            </div>
        </section>
    </main>

    <script type="module">
        import { initChildPage } from './js/child-ui.js';

        // 初始化孩子端页面
        console.log('开始初始化孩子端页面');
        try {
            initChildPage();
        } catch (error) {
            console.error('孩子端页面初始化失败:', error);
            alert('页面初始化失败，请刷新页面重试');
        }
    </script>
</body>
</html>
