<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭打卡系统</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <!-- 分流页：登录后按角色自动跳转（家长 → admin.html，孩子 → child.html） -->
    <div class="login-container">
        <div class="login-box redirect-box">
            <h2>家庭打卡系统</h2>
            <p class="redirect-text">正在进入，请稍候…</p>
            <p class="system-clock" id="system-clock"></p>
            <p class="redirect-link"><a href="login.html">没有自动跳转？点这里重新登录</a></p>
        </div>
    </div>

    <script type="module">
        import { getCurrentUser, redirectByRole } from './js/auth.js';
        import { startClock } from './js/clock.js';

        // 右上角（这里是中间）显示实时时间
        startClock();

        try {
            const user = await getCurrentUser();

            if (!user) {
                console.log('未登录，跳转到登录页');
                window.location.replace('login.html');
            } else {
                console.log('已登录，按角色分流');
                await redirectByRole();
            }
        } catch (error) {
            console.error('页面分流失败:', error);
            window.location.replace('login.html');
        }
    </script>
</body>
</html>
