<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务打卡系统 - 登录</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2>任务打卡系统</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn login-btn">登录</button>
                <div id="login-error" class="error-message"></div>
            </form>
        </div>
    </div>

    <script type="module">
        import { login } from './js/auth.js';
        import { showNotification } from './js/ui.js';

        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');

        // 添加重试机制
        async function loginWithRetry(email, password, maxRetries = 3) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const { success, error, user } = await login(email, password);
                    
                    if (success) {
                        return { success: true, user };
                    }
                    
                    // 如果是最后一次尝试或者不是网络错误，直接返回
                    if (i === maxRetries - 1 || !error?.message?.includes('network')) {
                        throw new Error(error);
                    }
                    
                    // 等待一段时间后重试
                    await new Promise(resolve => setTimeout(resolve, 1000));
                } catch (error) {
                    if (i === maxRetries - 1) {
                        throw new Error(`登录失败: ${error.message}（已重试${maxRetries}次）`);
                    }
                }
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            loginError.textContent = '';
            
            try {
                const { success, error, user } = await loginWithRetry(email, password);
                
                if (!success) {
                    throw new Error(error);
                }
                
                showNotification('登录成功', 'success');
                // 登录成功后跳转到主页面
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
                
            } catch (error) {
                loginError.textContent = error.message;
            }
        });
    </script>
</body>
</html>
